<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Truth Search — 证据查找</title>
  <link rel="stylesheet" href="/static/style.css?v=20">
  <script>
    // 防止暗色主题下页面闪白
    (function(){var t=localStorage.getItem("theme");if(!t)t=window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);})();
  </script>
</head>
<body>
  <a href="#query-input" class="skip-link">跳到输入区</a>
  <div class="app">

    <!-- 侧边栏：会话历史 -->
    <aside class="sidebar" id="sidebar" role="complementary" aria-label="会话历史">
      <div class="sidebar__header">
        <button id="new-chat-btn" class="sidebar__new-btn" aria-label="新对话">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          新对话
        </button>
      </div>
      <ul id="session-list" class="sidebar__list"></ul>
    </aside>

    <!-- 侧边栏遮罩（移动端） -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- 主对话区 -->
    <div class="chat-area">

      <!-- 顶部栏 -->
      <header class="header" id="header">
        <button id="sidebar-toggle" class="header__menu-btn" aria-label="菜单">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 class="header__title">Deep Truth Search</h1>
        <p class="header__subtitle">输入一个观点，系统将为您寻找证据</p>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换主题">
          <svg class="theme-toggle__moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="theme-toggle__sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </header>

      <!-- 对话流 -->
      <main class="main" id="conversation">
        <!-- 空状态 -->
        <div id="empty-state" class="empty-state">
          <div class="empty-state__icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </div>
          <p class="empty-state__text">输入您的观点，系统将为您寻找证据。</p>
        </div>
      </main>

      <!-- 底部输入区 -->
      <footer class="input-area">
        <div class="input-area__wrapper">
          <textarea
            id="query-input"
            class="input-area__textarea"
            placeholder="输入您的观点..."
            rows="1"
            aria-label="输入观点"
          ></textarea>
          <button
            id="send-btn"
            class="input-area__btn"
            type="button"
            aria-label="发送"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </footer>

    </div>
  </div>

  <!-- 搜索日志侧边面板 -->
  <div class="search-log-panel" id="searchLogPanel" style="display:none;">
    <div class="search-log-panel__header">
      <span class="search-log-panel__title"></span>
      <button class="search-log-panel__close" aria-label="关闭面板">&times;</button>
    </div>
    <div class="search-log-panel__body"></div>
  </div>
  <div class="search-log-backdrop" id="searchLogBackdrop" style="display:none;"></div>

  <script src="/static/app.js?v=20"></script>
</body>
</html>
